<!DOCTYPE html>
<html>
<head>
    <title>File Monitor Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>File Monitor Dashboard</h1>
        <table class="table">
            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for file in updated_files %}
                <tr>
                    <td>{{ file.name }}</td>
                    <td>
                        {% if file.status == 'Updated' %}
                        <span class="badge badge-success">Updated</span>
                        {% else %}
                        <span class="badge badge-danger">Not Updated</span>
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% if updated_files|length == 0 %}
        <p>No updated files found.</p>
        {% endif %}
    </div>
</body>
</html>
